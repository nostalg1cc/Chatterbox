[package]
name = "nitro-hero"
version = "0.2.6"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
minisign-verify = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
raw-window-handle = "0.6"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
opus-decoder = "0.1"
matroska-demuxer = "0.8"
opus = "0.3"
resvg = { version = "=0.45.1", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
tungstenite = { version = "0.30", features = ["native-tls"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.17"

[profile.dev]
debug = 0

# The decoder has a harmless shift overflow in a debug-only check, and needs speed anyway.
# Decoration frames decode in the background, but far too slowly unoptimized.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.opus-decoder]
opt-level = 3
overflow-checks = false

# One addition to GPUI 0.2.2: a glass drawing type, in scene.rs, window.rs and the Windows
# renderer and shaders. See docs/CURRENT-HANDOFF.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
