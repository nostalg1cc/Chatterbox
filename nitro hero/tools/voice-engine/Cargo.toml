[package]
name = "nitro-hero-voice-engine"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libwebrtc = "=0.3.50"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[[bin]]
name = "nitro-voice-engine"
path = "src/engine.rs"

[profile.dev]
debug = 0
